name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Timur Translator Realtime" `
            --icon "assets/TimurTranslator.ico" `
            --hidden-import websocket `
            --hidden-import pyaudio `
            --collect-submodules websocket `
            --collect-all soundcard `
            windows/timur_translator.py
          New-Item -ItemType Directory -Force release/windows | Out-Null
          Copy-Item "dist/Timur Translator Realtime.exe" "release/windows/Timur-Translator-Realtime-Windows-x64.exe"
          Copy-Item "windows/README_WINDOWS.txt" "release/windows/README_WINDOWS.txt"
          Compress-Archive -Path "release/windows/*" -DestinationPath "Timur-Translator-Realtime-Windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Timur-Translator-Realtime-Windows-x64
          path: Timur-Translator-Realtime-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: macos/requirements.txt

      - name: Install dependencies
        run: |
          brew install portaudio
          python -m pip install --upgrade pip
          python -m pip install -r macos/requirements.txt pyinstaller

      - name: Build Apple Silicon macOS app
        run: |
          iconutil -c icns assets/TimurTranslator.iconset -o assets/TimurTranslator.icns
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "Timur Translator Realtime" \
            --osx-bundle-identifier "com.timur.translator.realtime" \
            --icon "assets/TimurTranslator.icns" \
            --hidden-import websocket \
            --hidden-import pyaudio \
            --collect-submodules websocket \
            macos/timur_translator.py
          APP="dist/Timur Translator Realtime.app"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Timur Translator needs audio input access for microphone and BlackHole subtitle translation." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Timur Translator needs audio input access for microphone and BlackHole subtitle translation." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSHighResolutionCapable true" "$PLIST"
          codesign --force --deep --sign - "$APP"
          xattr -cr "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Timur-Translator-Realtime-macOS-arm64.zip"

      - name: Upload Apple Silicon package
        uses: actions/upload-artifact@v6
        with:
          name: Timur-Translator-Realtime-macOS-arm64
          path: Timur-Translator-Realtime-macOS-arm64.zip
          if-no-files-found: error

  macos-x64:
    name: macOS Intel app
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: macos/requirements.txt

      - name: Install dependencies
        run: |
          brew install portaudio
          python -m pip install --upgrade pip
          python -m pip install -r macos/requirements.txt pyinstaller

      - name: Build Intel macOS app
        run: |
          iconutil -c icns assets/TimurTranslator.iconset -o assets/TimurTranslator.icns
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "Timur Translator Realtime" \
            --osx-bundle-identifier "com.timur.translator.realtime" \
            --icon "assets/TimurTranslator.icns" \
            --hidden-import websocket \
            --hidden-import pyaudio \
            --collect-submodules websocket \
            macos/timur_translator.py
          APP="dist/Timur Translator Realtime.app"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Timur Translator needs audio input access for microphone and BlackHole subtitle translation." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Timur Translator needs audio input access for microphone and BlackHole subtitle translation." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSHighResolutionCapable true" "$PLIST"
          codesign --force --deep --sign - "$APP"
          xattr -cr "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Timur-Translator-Realtime-macOS-x64.zip"

      - name: Upload Intel package
        uses: actions/upload-artifact@v6
        with:
          name: Timur-Translator-Realtime-macOS-x64
          path: Timur-Translator-Realtime-macOS-x64.zip
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-x64
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: Timur-Translator-Realtime-*
          merge-multiple: true
          path: release-assets

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.zip --clobber
          else
            gh release create "$TAG" release-assets/*.zip \
              --title "Timur Translator Realtime $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
